name: Feature request
description: Propose a capability or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do? What is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: API/CLI shape, alternatives, and whether it preserves the invariants.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [recall, gatekeep, patrol, schema, MCP, docs, benchmarks, other]
